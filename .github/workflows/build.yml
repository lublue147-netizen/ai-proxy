name: Build and Release AI Proxy

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive_name: ai-proxy-windows-amd64
          - goos: windows
            goarch: arm64
            archive_name: ai-proxy-windows-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Download Go dependencies
        run: |
          rm -f go.sum
          go mod tidy

      - name: Build binary for ${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist/${{ matrix.archive_name }}
          go build -v -trimpath -ldflags="-s -w" -o dist/${{ matrix.archive_name }}/ai-proxy.exe .
          cp config.example.yaml dist/${{ matrix.archive_name }}/
          cp start.bat dist/${{ matrix.archive_name }}/
          cp README.md dist/${{ matrix.archive_name }}/

      - name: Package Windows ZIP
        run: |
          cd dist
          zip -r "${{ matrix.archive_name }}.zip" "${{ matrix.archive_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: dist/${{ matrix.archive_name }}.zip

      - name: Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive_name }}.zip
          generate_release_notes: true
